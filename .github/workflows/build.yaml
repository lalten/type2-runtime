name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This ensures that jobs get canceled when force-pushing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        appimage_arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - run: >-
        bazel build //:runtime
        --platforms @toolchains_llvm_bootstrapped//platforms/libc_aware:linux_${{ matrix.appimage_arch }}_musl
    - uses: actions/upload-artifact@v4
      with:
        name: runtime_${{ matrix.appimage_arch }}
        path: bazel-bin/runtime
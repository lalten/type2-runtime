name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.event.action == 'synchronize' }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            common --compilation_mode opt
            common --platforms @llvm//platforms:linux_${{ matrix.platform }}_musl

      - run: bazel build //runtime

      - run: cp bazel-bin/runtime/runtime ${{runner.temp}}/runtime-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{runner.temp}}/runtime-${{ matrix.platform }}
          archive: false

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: j178/prek-action@v2

  required:
    runs-on: ubuntu-slim
    needs: [build, prek]
    if: always()
    steps:
      - name: Fail if any ancestor job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
